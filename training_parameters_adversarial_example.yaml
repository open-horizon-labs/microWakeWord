# Example training configuration for adversarial TTS-robust model
# This configuration demonstrates how to train a wake word model that is robust
# to TTS-generated speech using adversarial training

batch_size: 200
clip_duration_ms: 1490
eval_step_interval: 500
train_dir: trained_models/adversarial_example

# Feature directories with TTS labels
# The 'is_tts' field indicates whether the dataset contains TTS-generated speech
# If not specified, it will be inferred from the directory name (containing "generated")
features:
# TTS-generated positive samples
- features_dir: /path/to/tts_generated_positive_samples
  penalty_weight: 1
  sampling_weight: 0.25
  truncation_strategy: truncate_start
  truth: true
  is_tts: true  # Mark as TTS-generated

# Real positive samples
- features_dir: /path/to/real_positive_samples  
  penalty_weight: 1
  sampling_weight: 0.25
  truncation_strategy: truncate_start
  truth: true
  is_tts: false  # Mark as real speech

# TTS-generated negative samples
- features_dir: /path/to/tts_generated_negative_samples
  penalty_weight: 0.5
  sampling_weight: 0.25
  truncation_strategy: truncate_start
  truth: false
  is_tts: true  # Mark as TTS-generated

# Real speech background
- features_dir: /path/to/real_speech_background
  penalty_weight: 3
  sampling_weight: 0.2
  truncation_strategy: random
  truth: false
  is_tts: false  # Mark as real speech

# Ambient background (usually real recordings)
- features_dir: /path/to/ambient_background
  penalty_weight: 2
  sampling_weight: 0.15
  truncation_strategy: split
  truth: false
  is_tts: false  # Mark as real speech

# SpecAugment parameters
freq_mask_count:
- 2
freq_mask_max_size:
- 5
freq_mix_augmentation_prob:
- 0
time_mask_count:
- 2
time_mask_max_size:
- 25

# Training parameters
learning_rates:
- 0.00025
training_steps:
- 120000

# Optimization metrics
maximization_metric: recall
minimization_metric: ambient_false_positives_per_hour

# Mix-up augmentation
mix_up_augmentation_prob:
- 0

# Class weights for wake word task
negative_class_weight:
- 40
positive_class_weight:
- 1