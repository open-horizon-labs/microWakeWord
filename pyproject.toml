[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microwakeword"
version = "0.1.0"
authors = [
  { name="Kevin Ahrendt", email="kahrendt@gmail.com" },
]
description = "A TensorFlow based wake word detection training framework using synthetic sample generation suitable for certain microcontrollers."
readme = "README.md"
requires-python = ">=3.10, <3.13"
dynamic = ["dependencies"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/kahrendt/microWakeWord"
Issues = "https://github.com/kahrendt/microWakeWord/issues"

[tool.black]
target-version = ["py310", "py311", "py312"]
exclude = 'generated'

[tool.ruff]
required-version = ">=0.5.0"
target-version = "py310"
exclude = ['generated', 'build', 'dist', '*.egg-info', 'notebooks/benchmark']

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes/autoflake
  "FURB", # refurb
  "I",    # isort
  "PERF", # performance
  "PL",   # pylint
  "SIM",  # flake8-simplify
  "UP",   # pyupgrade
]

ignore = [
  "E501", # line too long
  "PLC0415", # `import` should be at the top-level of a file
  "PLR0911", # Too many return statements
  "PLR0912", # Too many branches
  "PLR0913", # Too many arguments to function call
  "PLR0915", # Too many statements
  "PLW1641", # Object does not implement `__hash__` method
  "PLR2004", # Magic value used in comparison
  "PLW2901", # Outer variable overwritten by inner target
  "UP038"    # Use `X | Y` in `isinstance` call instead of `(X, Y)`
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = [
  "microwakeword",
]
combine-as-imports = true
split-on-trailing-comma = false