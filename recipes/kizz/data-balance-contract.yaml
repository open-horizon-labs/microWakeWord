schema_version: 1
training_split: train
splits: [train, validation, test]
require_each_split: [positive, negative]
required_metadata: [speaker_id, session_id]

# These are intentionally broad enough to support a new corpus, but strict
# enough to reject v32's Piper-only positive class and uniform file sampler.
overall:
  min_positive_fraction: 0.40
  max_positive_fraction: 0.60

classes:
  positive:
    min_source_groups: 3
    required_source_groups: [piper_synthetic, labeled_tts, device_replay]
    max_source_fraction: 0.50
    min_source_fractions:
      labeled_tts: 0.10
      device_replay: 0.10
  negative:
    min_source_groups: 4
    required_source_groups: [piper_hard_negative, public_speech, background, device_false_wake]
    max_source_fraction: 0.50
    min_source_fractions:
      public_speech: 0.05
      background: 0.05
      device_false_wake: 0.01

split_disjoint:
  speaker_id: true
  session_id: true
